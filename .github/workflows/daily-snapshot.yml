name: Daily data snapshot

on:
  schedule:
    - cron: "15 7 * * *" # after the 06:00 DELPHI panel and 05:30 PLAB run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and store snapshots
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          mkdir -p delphi/daily plab/daily

          curl -sf --retry 3 https://avenaterminal.com/api/v1/delphi > "delphi/daily/${DATE}.json"
          curl -sf --retry 3 https://avenaterminal.com/api/v1/plab   > "plab/daily/${DATE}.json"

          # Append-only CSV summaries (header created on first run)
          if [ ! -f delphi/index.csv ]; then
            echo "date,consensus_index,disagreement_index,n_questions,n_panelists" > delphi/index.csv
          fi
          jq -r --arg d "$DATE" '[$d, .consensus_index, .disagreement_index, (.panel|length), .n_panelists // ""] | @csv' \
            "delphi/daily/${DATE}.json" >> delphi/index.csv || true

          if [ ! -f plab/index.csv ]; then
            echo "date,model,accuracy_pct" > plab/index.csv
          fi
          jq -r --arg d "$DATE" '.scores[]? | [$d, .model_label, .accuracy] | @csv' \
            "plab/daily/${DATE}.json" >> plab/index.csv || true

          # Market observations — the uncopyable series (town aggregates,
          # movement ledger, observed price moves, delisting tombstones).
          # Generated nightly by the avena-terminal feed workflow. Guarded:
          # if the artifacts are not yet published we skip loudly rather
          # than committing an error page as data.
          mkdir -p market
          if curl -sf --retry 3 https://avenaterminal.com/open-data/dataset.json > market/dataset.json; then
            for f in towns.csv towns.json movement-ledger.csv movement-ledger.json moves.csv moves.json tombstones.csv tombstones.json; do
              curl -sf --retry 3 "https://avenaterminal.com/open-data/${f}" > "market/${f}"
            done
            echo "market artifacts: $(jq -r .version market/dataset.json)"
          else
            rm -f market/dataset.json
            echo "::warning::market artifacts not yet published at avenaterminal.com/open-data/ — skipped"
          fi

      - name: Commit
        run: |
          git config user.name "avena-bot"
          git config user.email "actions@avenaterminal.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: snapshot $(date -u +%F)"
          git push
